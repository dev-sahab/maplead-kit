<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapLead Kit — Lead Manager</title>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-light: #eff6ff;
      --color-success: #10b981;
      --color-success-hover: #059669;
      --color-danger: #ef4444;
      --color-danger-hover: #dc2626;

      --color-bg-page: #f8fafc;
      --color-bg-card: #ffffff;
      --color-bg-subtle: #f1f5f9;

      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-text-dim: #94a3b8;

      --color-border: #e2e8f0;
      --color-border-hover: #cbd5e1;

      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-bg-page);
      color: var(--color-text-main);
      min-height: 100vh;
      padding: 20px;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .page-header {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon img {
      width: 28px;
      height: 28px;
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-main);
      margin-bottom: 2px;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--color-text-muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    /* Toolbar */
    .toolbar {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
      max-width: 400px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 38px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: inherit;
      color: var(--color-text-main);
      background: var(--color-bg-card);
      outline: none;
      transition: all 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-light);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: 7px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-card);
      color: var(--color-text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-pill:hover {
      border-color: var(--color-border-hover);
      background: var(--color-bg-subtle);
    }

    .filter-pill.active {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 600;
    }

    .stats-badge {
      padding: 7px 12px;
      background: var(--color-bg-subtle);
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-main);
      white-space: nowrap;
    }

    /* Table Card */
    .table-card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      background: var(--color-bg-subtle);
      border-bottom: 2px solid var(--color-border);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text-main);
    }

    tbody tr {
      transition: background 0.1s ease;
    }

    tbody tr:hover {
      background: var(--color-bg-subtle);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .cell-business {
      font-weight: 600;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-category {
      color: var(--color-text-muted);
      font-size: 12px;
    }

    .cell-link {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
    }

    .cell-link:hover {
      text-decoration: underline;
    }

    .cell-location {
      font-size: 12px;
      color: var(--color-text-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-source {
      background: var(--color-primary-light);
      color: var(--color-primary);
    }

    .badge-success {
      background: #ecfdf5;
      color: var(--color-success);
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--color-text-muted);
    }

    .empty-state svg {
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-main);
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 13px;
    }

    /* Footer */
    .page-footer {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--color-text-muted);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--color-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
    }

    .btn-success {
      background: var(--color-success);
      color: #ffffff;
    }

    .btn-success:hover {
      background: var(--color-success-hover);
    }

    .btn-outline {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      color: var(--color-text-main);
    }

    .btn-outline:hover {
      border-color: var(--color-border-hover);
      background: var(--color-bg-subtle);
    }

    .btn-danger {
      background: transparent;
      color: var(--color-danger);
      border: none;
      padding: 6px 12px;
    }

    .btn-danger:hover {
      background: #fef2f2;
      color: var(--color-danger-hover);
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- Header -->
    <header class="page-header">
      <div class="brand-section">
        <div class="brand-icon">
          <img src="icons/icon-48.png" alt="MapLead Kit" />
        </div>
        <div class="brand-text">
          <h1>Lead Manager</h1>
          <p>View, filter, and export your collected business leads</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="importBtn" class="btn btn-outline">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Import CSV
        </button>
        <button id="exportBtn" class="btn btn-success">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export All
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search by business name, phone, city..."
        />
      </div>

      <div class="filter-group">
        <button class="filter-pill" id="filterWebsite" data-active="false">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          Has Website
        </button>
        <button class="filter-pill" id="filterPhone" data-active="false">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          Has Phone
        </button>
        <button class="filter-pill" id="filterEmail" data-active="false">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          Has Email
        </button>
      </div>

      <div class="stats-badge" id="leadCountBadge">
        <span class="loading-spinner"></span>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-wrapper">
        <table id="leadsTable">
          <thead>
            <tr>
              <th>Business Name</th>
              <th>Category</th>
              <th>Phone</th>
              <th>Website</th>
              <th>Email</th>
              <th>Location</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="leadsBody">
            <tr>
              <td colspan="7" class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M9 11l3 3L22 4"></path>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <h3>No leads yet</h3>
                <p>Start collecting leads from Google Maps to see them here</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer -->
    <footer class="page-footer">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>All data stored locally in your browser · No external transmission</span>
      </div>
      <button id="clearAllBtn" class="btn-danger">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Clear All Leads
      </button>
    </footer>
  </div>

  <input type="file" id="csvFileInput" accept=".csv" style="display: none;" />
  <script src="main.js"></script>
</body>
</html>

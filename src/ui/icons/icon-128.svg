<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#2563eb" rx="24"/>

  <!-- Map Pin Shape -->
  <g transform="translate(64, 50)">
    <!-- Pin body -->
    <path d="M 0 -20 C -11 -20 -20 -11 -20 0 C -20 15 0 35 0 35 C 0 35 20 15 20 0 C 20 -11 11 -20 0 -20 Z" fill="#ffffff"/>

    <!-- Pin dot -->

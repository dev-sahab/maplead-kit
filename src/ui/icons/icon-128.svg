  <!-- Document/List overlay -->
  <g transform="translate(64, 75)">
    <rect x="-12" y="-8" width="24" height="16" fill="none" stroke="#ffffff" stroke-width="1.5" rx="2"/>
    <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#ffffff" stroke-width="1"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="1"/>
    <line x1="-8" y1="4" x2="8" y2="4" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>
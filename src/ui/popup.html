<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapLead Kit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-card">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-box">
          <img src="icons/icon-48.png" alt="MapLead Kit" class="app-logo" />
        </div>
        <div class="brand-info">
          <h1 class="brand-title">MapLead Kit</h1>
          <span class="brand-tag">Google Maps Lead Finder</span>
        </div>
      </div>
      <button id="openManagerBtn" class="btn-icon" title="Open Full Lead Manager">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </header>

    <!-- Main Content Container -->
    <main class="app-body">
      <!-- Target Tab Status Card -->
      <div id="targetCard" class="info-card">
        <div class="card-row">
          <div class="indicator-dot ready" id="statusDot"></div>
          <span class="card-caption" id="targetLabel">Active Google Maps tab</span>
        </div>
        <div class="target-query-text" id="targetQueryText">Detecting search query...</div>
      </div>

      <!-- Settings & Filters Section -->
      <div class="section-group" id="configSection">
        <div class="input-row">
          <label for="leadLimit" class="field-label">Lead Collection Limit</label>
          <div class="input-with-stepper">
            <input type="number" id="leadLimit" class="text-input" min="5" max="10000" step="10" value="50" />
            <span class="input-unit">leads</span>
          </div>
        </div>

        <div class="filter-section">
          <span class="field-label">Quick Filters</span>
          <div class="pills-grid">
            <label class="toggle-pill">
              <input type="checkbox" id="filterWebsite" />
              <span class="pill-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                Has Website
              </span>
            </label>
            <label class="toggle-pill">
              <input type="checkbox" id="filterPhone" />
              <span class="pill-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                Has Phone
              </span>
            </label>
          </div>
        </div>
      </div>

      <!-- Action Area -->
      <div class="action-section">
        <button id="runBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Start Collecting Leads
        </button>
      </div>

      <!-- Live Scraping Progress (Hidden by default) -->
      <div id="progressBox" class="progress-panel" style="display: none;">
        <div class="progress-meta">
          <div class="status-indicator">
            <span class="pulsing-ring"></span>
            <span class="status-name" id="progressStatusText">Scrolling results...</span>
          </div>
          <span class="progress-numbers" id="progressCount">0 / 50</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
        </div>
        <div class="latest-lead-card" id="latestLeadBox">
          <span class="latest-label">Latest lead captured:</span>
          <div class="latest-name" id="latestLeadPreview">—</div>
        </div>
        <div class="progress-controls">
          <button id="stopBtn" class="btn btn-danger-outline">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12"></rect>
            </svg>
            Stop Collection
          </button>
        </div>
      </div>

      <!-- Results & Export Box (Hidden until leads collected) -->
      <div id="resultsBox" class="results-panel" style="display: none;">
        <div class="results-header">
          <div class="results-count-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span id="collectedTotal">0 leads ready</span>
          </div>
        </div>

        <div class="export-options">
          <label for="exportSort" class="field-label-sm">Export Sorting</label>
          <select id="exportSort" class="select-input">
            <option value="website-first">Websites first (Recommended)</option>
            <option value="website-last">Websites last</option>
            <option value="original">Original Maps order</option>
          </select>
        </div>

        <button id="exportCsvBtn" class="btn btn-success">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export CSV File
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="privacy-note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>100% Local & Private · Data stays in your browser</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>

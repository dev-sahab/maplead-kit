<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapLead Kit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-badge">📍</span>
        <div>
          <h1>MapLead Kit</h1>
          <p class="subtitle">Google Maps Lead Scraper</p>
        </div>
      </div>
    </header>

    <!-- Step 1 & 2: Set Range / Limit -->
    <div class="card">
      <div class="card-header">
        <span class="step-num">1</span>
        <label for="leadLimit">How many leads do you want?</label>
      </div>
      <div class="input-row">
        <input type="number" id="leadLimit" min="1" max="1000" value="20" placeholder="e.g. 50" />
        <span class="input-unit">leads</span>
      </div>
    </div>

    <!-- Step 3: Choose Filters -->
    <div class="card">
      <div class="card-header">
        <span class="step-num">2</span>
        <span>Filter requirements (Optional)</span>
      </div>
      <div class="filter-chips">
        <label class="chip">
          <input type="checkbox" id="filterWebsite" />
          <span>Must have website</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="filterPhone" />
          <span>Must have phone</span>
        </label>
      </div>

      <div class="sort-select-row">
        <label for="exportSort">Export order:</label>
        <select id="exportSort">
          <option value="website-first">Websites first</option>
          <option value="website-last">Websites last</option>
          <option value="original">Original Maps order</option>
        </select>
      </div>
    </div>

    <!-- Step 4: Run / Scraping Action -->
    <div class="action-section">
      <button id="runBtn" class="btn btn-primary">
        <span class="btn-icon">▶</span> Run & Collect Leads
      </button>

      <!-- Scraping progress box (hidden until Run is clicked) -->
      <div id="progressBox" class="progress-box" style="display: none;">
        <div class="progress-header">
          <span class="pulse-indicator"></span>
          <span id="progressStatusText">Scrolling & copying leads...</span>
          <strong id="progressCount">0 / 20</strong>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-fill" style="width: 0%;"></div>
        </div>
        <div class="latest-lead" id="latestLeadPreview">
          Waiting for first record...
        </div>
        <button id="stopBtn" class="btn btn-outline-danger">Stop</button>
      </div>

      <!-- Success & Export Section (shown after completion) -->
      <div id="successBox" class="success-box" style="display: none;">
        <div class="success-message">
          <span class="check-icon">✓</span>
          <div>
            <strong>Collection complete!</strong>
            <p id="successSummary">20 leads collected & ready.</p>
          </div>
        </div>
        <button id="exportCsvBtn" class="btn btn-success">
          Download CSV File ↓
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Auto-scrolls left list · Exports clean readable CSV</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
